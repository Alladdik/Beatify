<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  .wrap {
    width: 380px; height: 300px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, rgba(48,209,88,0.18), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(10,132,255,0.14), transparent 60%),
                rgba(8, 8, 15, 0.96);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 32px 80px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(40px);
    animation: fadeIn 0.4s ease;
    font-family: -apple-system, 'Inter', system-ui, sans-serif;
    gap: 20px;
  }

  .logo-ring {
    width: 88px; height: 88px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(48,209,88,0.25), rgba(10,132,255,0.2));
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(48,209,88,0.25);
    animation: pulse 2s ease-in-out infinite;
  }

  .logo-ring svg {
    color: #30d158;
    filter: drop-shadow(0 0 12px rgba(48,209,88,0.5));
  }

  .name {
    font-size: 32px; font-weight: 800;
    background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .dots {
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(48,209,88,0.7);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse  { 0%,100% { box-shadow: 0 8px 32px rgba(48,209,88,0.25); } 50% { box-shadow: 0 8px 48px rgba(48,209,88,0.5); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-6px); opacity: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-ring">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </div>
  <div class="name">Beatify</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
