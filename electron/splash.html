<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .wrap {
    width: 380px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #0c0c10; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #ecebf2;
    animation: in 0.35s cubic-bezier(.16,1,.3,1);
  }
  .mark { color: #b9a9fb; }
  .name { font-size: 30px; font-weight: 600; letter-spacing: -0.045em; }
  .bar { width: 120px; height: 2px; background: rgba(255,255,255,0.14); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #b9a9fb; animation: slide 1.1s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" width="56" height="56" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
      <rect x="8" y="3" width="5" height="25" rx="1"/>
      <path fill-rule="evenodd" d="M19 11a8.5 8.5 0 0 0 0 17a8.5 8.5 0 0 0 0-17ZM16.8 15.7L23.2 19.5L16.8 23.3Z"/>
    </svg>
    <div class="name">Beatify</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
