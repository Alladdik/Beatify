# Beatify — приклад конфігу nginx для VPS (reverse proxy → Docker :5000)
# Поклади в /etc/nginx/sites-available/beatify і зроби symlink:
#   sudo ln -s /etc/nginx/sites-available/beatify /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Для HTTPS після цього:  sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;   # ← заміни на свій домен або IP

    # Великі завантаження треків
    client_max_body_size 512M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (SignalR хаби /hubs/*)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;

        # Стрімінг аудіо — без буферизації
        proxy_buffering    off;
    }
}
