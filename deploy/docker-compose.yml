name: beatify

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: beatify
      POSTGRES_USER: beatify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatify -d beatify"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Direct access on :5000 (HTTP). With a domain, deploy.sh sets APP_BIND=127.0.0.1 so only Caddy can reach it.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Database=beatify;Username=beatify;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in deploy/.env}
      Cors__Origins: ${CORS_ORIGINS:-}
      Auth__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - uploads:/app/wwwroot/uploads
      - studio:/data/studio

  # Automatic HTTPS (Let's Encrypt). Enable with:  --profile https   and DOMAIN=music.example.com in deploy/.env
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  studio:
  caddy_data:
  caddy_config:
